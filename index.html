<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>K's AI Trading Desk</title>
<style>
:root{--bg:#0e0b09;--card:#17130f;--card2:#1f1914;--line:#2e251d;--txt:#f2e8dc;--dim:#a8998a;--green:#7ac142;--up:#39d98a;--down:#ff5c5c;--gold:#ffd34d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:560px;margin:0 auto;padding:0 0 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;gap:8px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 35% 30%,#c6f58f,#5a9e2f);display:grid;place-items:center;box-shadow:0 0 14px rgba(155,225,93,.45)}
.logo i{width:12px;height:12px;background:#3d2a17;border-radius:50%;box-shadow:0 0 0 2px #e2ffc4}
h1{font-size:15px;margin:0}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.clock{text-align:right;font-size:11px;color:var(--dim)}
.clock b{display:block;color:var(--txt);font-size:13px}
.mkt{display:inline-block;margin-top:2px;padding:1px 6px;border-radius:9px;font-size:10px;background:#2a211a}
.mkt.open{background:#123d24;color:var(--up)}
.ticker{overflow:hidden;background:#050403;border-top:1px solid #3b2a1a;border-bottom:1px solid #3b2a1a;white-space:nowrap}
.ticker .track{display:inline-flex;animation:scroll 24s linear infinite;padding:7px 0}
.ticker .item{font-size:12px;padding:0 14px;border-right:1px solid #2a2018;display:inline-flex;gap:6px;align-items:baseline}
.ticker .sym{color:#ffe7b0;font-weight:700}.ticker .pr{color:#ddd}.ticker .up{color:var(--up)}.ticker .dn{color:var(--down)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.floor{position:relative;background:#3a2415;user-select:none;overflow:hidden}
.floor canvas{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}
.ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);font:600 9.5px/1.1 ui-sans-serif,-apple-system,Roboto,Arial,sans-serif;padding:3px 7px 3px 6px;background:rgba(18,13,9,.82);color:#fff3e0;border:1px solid rgba(255,220,170,.22);border-radius:99px;white-space:nowrap;pointer-events:auto;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;gap:5px}
.tag i{width:6px;height:6px;border-radius:50%;flex:none}
.tag small{font-size:8px;color:#a7e06d;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-left:2px}
.tag.risk small{color:#ff9b9b}
.tag.kiwi{background:rgba(30,52,14,.9);border-color:rgba(155,225,93,.6);box-shadow:0 0 10px rgba(155,225,93,.35)}
.bub{position:absolute;transform:translate(-50%,-100%) scale(.7);opacity:0;transition:opacity .3s,transform .3s cubic-bezier(.2,1.4,.4,1);font:600 10px/1.25 ui-sans-serif,-apple-system,Roboto,Arial,sans-serif;background:rgba(255,252,246,.96);color:#1b120a;padding:4px 8px;max-width:40%;width:max-content;text-align:center;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 1.5px var(--a,#fff)}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(255,252,246,.96);border-bottom:0}
.bub.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.hint{font-size:11px;color:var(--dim);text-align:center;padding:8px 10px 0}
.cards{display:grid;gap:12px;padding:12px}
@media(min-width:900px){.wrap{max-width:1100px}.layout{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:0 8px;align-items:start}.cards{grid-template-columns:1fr 1fr;padding-top:0}.floorcol{position:sticky;top:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:11px;color:var(--dim)}
.v{font-size:18px;font-weight:700;margin-top:2px}.v.sm{font-size:14px}
.big{font-size:22px;font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:#2a211a;color:var(--txt);font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap}
.pill.wait{background:#3a2e0c;color:var(--gold)}.pill.warn{background:#3d1515;color:#ff9b9b}.pill.ok{background:#123d24;color:var(--up)}
.buy{color:var(--up)}.sell{color:var(--down)}.neg{color:var(--down)}.pos{color:var(--up)}
.cond{margin-top:10px;font-size:13px;color:#e3d6c6;background:var(--card2);border-radius:10px;padding:9px 10px;border-left:3px solid var(--gold)}
.ladder{position:relative;height:34px;margin:14px 4px 4px}
.ladder .bar{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--down) 0,var(--down) var(--e),var(--up) var(--e),var(--up) 100%);opacity:.75}
.ladder .mk{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--dim);text-align:center;white-space:nowrap}
.ladder .mk:after{content:"";display:block;width:2px;height:12px;background:#fff;margin:2px auto 0}
.zoneband{position:absolute;top:13px;height:8px;background:rgba(255,211,77,.35);border:1px solid var(--gold);border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px;gap:8px}
.row:first-of-type{border-top:0}
.sched .row{justify-content:flex-start}
.sched .t{width:76px;font-weight:700;color:#ffe7b0;flex:none}
.sched .row.next{background:#1d2a12;border-radius:8px;padding:8px;border-top-color:transparent}
.sched .row.done{opacity:.5}.sched .row .nx{margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:600;color:var(--dim);text-align:right;padding:4px 0;font-size:11px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-top:1px solid var(--line);text-align:right}
td:first-child{padding-right:6px}
.note{margin-top:10px;font-size:12px;color:var(--dim)}
.strat{background:var(--card2);border-radius:10px;padding:10px 11px;margin-top:8px}
.strat:first-of-type{margin-top:0}
.strat .sh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:13.5px}
.strat .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.strat .stats b{display:block;font-size:14px;margin-top:1px}
ul.rules,ul.log{list-style:none;margin:0;padding:0}
ul.rules li{padding:7px 0 7px 24px;position:relative;font-size:13.5px;border-top:1px solid var(--line)}
ul.rules li:first-child,ul.log li:first-child{border-top:0}
ul.rules li:before{content:"";position:absolute;left:3px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(122,193,66,.6)}
ul.log li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
ul.log .d{flex:none;width:44px;color:#ffe7b0;font-weight:700;font-size:12px;padding-top:1px}
footer{text-align:center;color:var(--dim);font-size:11px;padding:6px 14px 20px;line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:5px;vertical-align:middle}.dot.err{background:var(--down)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#1a1410;border-top:1px solid #6b4021;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;z-index:11;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.sheet{visibility:hidden}.open .sheet{transform:none;visibility:visible}.open .sheet-bg{opacity:1;pointer-events:auto}
.sheet .hd{display:flex;align-items:center;gap:12px}
.sheet canvas{width:56px;height:76px;border-radius:12px;border:1px solid #6b4021;flex:none}
.sheet h3{margin:0;font-size:18px}.sheet .role{font-size:12px;color:var(--dim);margin-top:3px}
.sheet .status{margin:14px 0 8px;font-size:15px;background:#241c15;border-radius:10px;padding:10px 12px;border-left:3px solid var(--green)}
.sheet .chips{display:flex;flex-wrap:wrap;gap:6px}
.sheet .chips span{font-size:12px;background:#2a211a;border-radius:99px;padding:4px 9px;color:#e3d6c6}
.sheet .close{margin-left:auto;background:#2a211a;color:var(--txt);border:0;border-radius:99px;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none}
.sheet .upd{margin-top:12px;font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo"><i></i></div><div><h1 id="deskName">K's AI Trading Desk</h1><div class="sub">Last updated: <span id="updTop">-</span></div></div></div>
    <div class="clock mono"><b id="clk">--:--</b>ET <span id="mkt" class="mkt">-</span></div>
  </header>
  <div class="ticker mono"><div class="track" id="track"></div></div>
  <div class="layout">
    <div class="floorcol">
      <div class="floor" id="floor">
        <canvas id="cv" width="360" height="500" aria-label="Trading floor with eight AI agent bots at their desks"></canvas>
        <div class="ov" id="ov"></div>
      </div>
      <div class="hint">Tap a bot to see what it's doing</div>
    </div>
    <div class="cards" id="cards"></div>
  </div>
  <footer><span class="dot" id="syncDot"></span><span id="sync">Loading desk data…</span><br>Last updated: <span id="updBot">-</span><br>Charts on the floor screens are animation only. Real numbers come from data.json.</footer>
</div>
<div id="sheetRoot"><div class="sheet-bg" id="sheetBg"></div><div class="sheet" role="dialog" aria-modal="true">
  <div class="hd"><canvas id="pv" width="56" height="76"></canvas><div><h3 id="sName"></h3><div class="role" id="sRole"></div></div><button class="close" id="sClose" aria-label="Close">&times;</button></div>
  <div class="status" id="sStatus"></div>
  <div class="chips" id="sChips"></div>
  <div class="upd" id="sUpd"></div>
</div></div>
<script>
(function(){
"use strict";
var DATA=null;
var W=360,H=500;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),K=1,DPR=1;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
var seed=11;function srand(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function lg(c,x0,y0,x1,y1,st){var g=c.createLinearGradient(x0,y0,x1,y1);for(var i=0;i<st.length;i+=2)g.addColorStop(st[i],st[i+1]);return g;}
function rg(c,x,y,r0,r1,st){var g=c.createRadialGradient(x,y,r0,x,y,r1);for(var i=0;i<st.length;i+=2)g.addColorStop(st[i],st[i+1]);return g;}
function ell(c,x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=fill;c.fill();}
function cap(c,x1,y1,x2,y2,wd,col){c.lineCap='round';c.strokeStyle=col;c.lineWidth=wd;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function glow(c,col,b){c.shadowColor=col;c.shadowBlur=b*K;}
function noglow(c){c.shadowBlur=0;c.shadowColor='transparent';}
function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}

/* ---------- bots ---------- */
var BOTS={
 scanner:{col:0,row:0,accent:'#36c5ff',suit:'#2a5d8f',skin:'#f0cfb4',hair:'#2b1d14',style:'visor',hairStyle:'short',mons:['chart','candle']},
 news:{col:1,row:0,accent:'#ffc94d',suit:'#8a6420',skin:'#d9a882',hair:'#5a2f17',style:'eyes',hairStyle:'bob',mons:['news','news2']},
 whale:{col:2,row:0,accent:'#3fe0ff',suit:'#1d4f7c',skin:'#8d5b3f',hair:'#111',style:'helmet',hairStyle:'none',mons:['whale','candle']},
 quant:{col:0,row:1,accent:'#b07cff',suit:'#4b347a',skin:'#f3d6c0',hair:'#1a1a2a',style:'lens',hairStyle:'swept',mons:['equity','chart']},
 kiwi:{col:1,row:1,accent:'#9be15d',suit:'#3f6b22',skin:'#efc9a8',hair:'#3a2616',style:'halo',hairStyle:'swept',mons:['plan','kchart'],kiwi:true},
 options:{col:2,row:1,accent:'#2ee6a6',suit:'#1f5f50',skin:'#c68e6a',hair:'#222',style:'helmet',hairStyle:'none',mons:['chain','chart']},
 journal:{col:0,row:2,accent:'#ff9d5c',suit:'#6b4433',skin:'#e6b896',hair:'#7a3b1c',style:'eyes',hairStyle:'bun',mons:['ledger','chart']},
 risk:{col:2,row:2,accent:'#ff4d5e',suit:'#7a2630',skin:'#f0cfb4',hair:'#c9ccd4',style:'visor',hairStyle:'short',mons:['chartRed','stop']}
};
var NAMES={scanner:'Scanner',news:'News Desk',whale:'Whale Tracker',quant:'Quant Lab',kiwi:'Kiwi',options:'Options Desk',journal:'Trade Journal',risk:'Risk Manager'};
var SUBS={kiwi:'head of desk',risk:'says no'};
var ORDER=['scanner','news','whale','quant','kiwi','options','journal','risk'];
var ROWY=[120,270,420],COLX=[60,180,300],LANES=[118,242],SPOT_Y=338;
ORDER.forEach(function(id){
 var b=BOTS[id];b.id=id;b.w=b.kiwi?110:104;b.dx=COLX[b.col]-b.w/2;b.dy=ROWY[b.row];
 b.cx=COLX[b.col];b.fy=b.dy+14;b.x=b.cx;b.y=b.fy;b.state='sit';b.phase=Math.random()*6;
 b.blinkAt=performance.now()+800+Math.random()*3000;b.blinkUntil=0;b.look=0;
 var mw=b.kiwi?38:34,mh=b.kiwi?27:24;
 b.monObjs=[mkMon(b.mons[0],b.dx+4,b.dy-mh-2,mw,mh,b),mkMon(b.mons[1],b.dx+b.w-4-mw,b.dy-mh-2,mw,mh,b)];
 var lane=b.col===2?LANES[1]:LANES[0],spot=b.col===2?212:148;
 if(!b.kiwi)b.path=[[lane,b.fy],[lane,SPOT_Y],[spot,SPOT_Y]];
});
function mkMon(type,x,y,w,h,b){
 var m={type:type,x:x,y:y,w:w,h:h,data:[],off:0,flick:0,v:.5,acc:b.accent};
 var N=22,i;
 if(/chart|kchart|chartRed/.test(type)){var v=.5;for(i=0;i<N;i++){v=step(v,type);m.data.push(v);}}
 if(type==='candle'){m.v=.5;for(i=0;i<9;i++)m.data.push(mkCandle(m));}
 if(type==='news'||type==='news2'||type==='ledger'){for(i=0;i<10;i++)m.data.push(mkLine());}
 if(type==='equity'){m.curves=[0,1,2].map(function(j){var v=.25+j*.1,a=[];for(var q=0;q<N;q++){v=Math.max(.05,Math.min(.95,v+(Math.random()-.45+(j-1)*.04)*.09));a.push(v);}return a;});}
 if(type==='chain'){m.cells=[];for(i=0;i<36;i++)m.cells.push(Math.random());}
 if(type==='whale'){m.wx=.3;m.wd=1;}
 return m;
}
function step(v,t){var d=t==='chartRed'?-.01:t==='kchart'?.012:0;v+=(Math.random()-.5)*.17+d;if(v>.9)v=.9-Math.random()*.15;if(v<.1)v=.1+Math.random()*.15;return v;}
function mkCandle(m){var o=m.v,c=Math.min(.88,Math.max(.12,o+(Math.random()-.48)*.25));m.v=c;return {o:o,c:c,h:Math.max(o,c)+Math.random()*.08,l:Math.min(o,c)-Math.random()*.08};}
function mkLine(){var r=Math.random();return {w:.3+Math.random()*.6,c:r<.15?'#ff6b6b':r<.32?'#ffd34d':'#9fb1bd',d:r<.4?'#39d98a':r<.7?'#ff5c5c':'#8a97a3'};}

/* ---------- sizing + static background ---------- */
var bg=document.createElement('canvas'),bgc=bg.getContext('2d');
function resize(){
 var cssW=cv.parentNode.clientWidth||360;DPR=Math.min(3,window.devicePixelRatio||1);
 cv.width=Math.round(cssW*DPR);cv.height=Math.round(cssW*H/W*DPR);K=cv.width/W;
 bg.width=cv.width;bg.height=cv.height;buildBg();
}
function plant(c,x,y,s){
 c.save();c.translate(x,y);c.scale(s,s);
 ell(c,0,22,13,4,'rgba(0,0,0,.25)');
 c.fillStyle=lg(c,-10,0,10,0,[0,'#b5653a',1,'#7d3f20']);c.beginPath();c.moveTo(-10,6);c.lineTo(10,6);c.lineTo(7,22);c.lineTo(-7,22);c.closePath();c.fill();
 c.fillStyle='#c97a4a';rr(c,-11,4,22,4,2);c.fill();
 var leaves=[[-9,-8,-.8],[9,-8,.8],[0,-14,0],[-5,-16,-.35],[5,-16,.35],[-12,-1,-1.2],[12,-1,1.2]];
 leaves.forEach(function(l,i){c.save();c.translate(l[0]*.6,4);c.rotate(l[2]);c.fillStyle=lg(c,0,-18,0,0,[0,i%2?'#6fd17a':'#4fbf63',1,'#226b34']);c.beginPath();c.ellipse(0,-9,4.2,10,0,0,Math.PI*2);c.fill();c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=.6;c.beginPath();c.moveTo(0,-1);c.lineTo(0,-17);c.stroke();c.restore();});
 c.restore();
}
function buildBg(){
 var c=bgc;c.setTransform(K,0,0,K,0,0);seed=11;
 // floor
 c.fillStyle=lg(c,0,64,0,H,[0,'#a06a3c',1,'#7c4b27']);c.fillRect(0,64,W,H-64);
 for(var y=64;y<H;y+=16){var r=((y-64)/16)%3;c.fillStyle=r===0?'rgba(255,220,170,.05)':r===1?'rgba(0,0,0,.04)':'rgba(0,0,0,0)';c.fillRect(0,y,W,16);
   c.fillStyle='rgba(60,30,10,.35)';c.fillRect(0,y+15.4,W,.6);
   var off=((y/16)%4)*37;for(var x=off;x<W;x+=120){c.fillRect(x,y,.6,15.4);}
   for(var g=0;g<10;g++){c.strokeStyle='rgba(70,35,12,.12)';c.lineWidth=.5;var gx=srand()*W,gy=y+3+srand()*10;c.beginPath();c.moveTo(gx,gy);c.bezierCurveTo(gx+8,gy-1.5,gx+16,gy+1.5,gx+26,gy);c.stroke();}}
 // runway carpet
 c.fillStyle=lg(c,160,0,200,0,[0,'#2a5230',.5,'#346a3b',1,'#2a5230']);c.fillRect(162,64,36,H-64);
 c.fillStyle='rgba(180,230,160,.25)';c.fillRect(164,64,.8,H-64);c.fillRect(195.2,64,.8,H-64);
 // rug under kiwi
 c.fillStyle='rgba(0,0,0,.18)';rr(c,104,206,152,120,12);c.fill();
 c.fillStyle=lg(c,0,200,0,330,[0,'#7a3434',1,'#5c2626']);rr(c,102,202,156,120,12);c.fill();
 c.strokeStyle='rgba(230,180,90,.55)';c.lineWidth=1.2;rr(c,108,208,144,108,8);c.stroke();
 c.strokeStyle='rgba(230,180,90,.25)';c.lineWidth=.8;rr(c,113,213,134,98,6);c.stroke();
 // wall
 c.fillStyle=lg(c,0,0,0,64,[0,'#3a2415',1,'#4c301c']);c.fillRect(0,0,W,64);
 for(var px=0;px<W;px+=24){c.fillStyle='rgba(0,0,0,.12)';c.fillRect(px,0,.7,52);}
 c.fillStyle=lg(c,0,50,0,64,[0,'#6a4426',1,'#523319']);c.fillRect(0,50,W,14);

  if(weekday)for(var i=0;i<D.schedule.length;i++){var tm=parseT(D.schedule[i].time);if(tm!=null&&tm>=nowM){nextIdx=i;break;}}
  h+='<section class="card sched"><h2>Schedule <span class="k" style="letter-spacing:0;text-transform:none">ET</span></h2>'+D.schedule.map(function(s,i){
   var tm=parseT(s.time),cls=weekday&&tm!=null&&tm<nowM?'done':i===nextIdx?'next':'';
   return '<div class="row '+cls+'"><span class="t mono">'+esc(s.time)+'</span><span>'+esc(s.label)+'</span>'+(i===nextIdx?'<span class="pill ok nx">next</span>':'')+'</div>';
  }).join('')+'</section>';
 }
 var bt=D.backtest;
 if(bt){
  h+='<section class="card"><h2>Backtest <span class="pill warn">'+esc(bt.note||'')+'</span></h2><div style="font-size:14px;font-weight:700">'+esc(bt.title)+(bt.shares?' · '+esc(bt.shares)+' shares':'')+'</div><div class="k" style="margin:3px 0 8px">'+esc(bt.sample||'')+(bt.basis?' · '+esc(bt.basis):'')+'</div>'+
   '<table><tr><th>Variant</th><th>Win %</th><th>P&amp;L</th></tr>'+(bt.rows||[]).map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+(typeof r.winRate==='number'?r.winRate.toFixed(1)+'%':'-')+'</td><td class="'+(r.pnl<0?'neg':'pos')+'">'+signed(r.pnl)+'</td></tr>';}).join('')+'</table>'+
   '<div class="note">'+esc(bt.note||'')+'. Small sample, before fees.</div></section>';
 }
 if(D.playbook&&D.playbook.length){
  h+='<section class="card"><h2>Playbook <span class="k" style="letter-spacing:0;text-transform:none">'+D.playbook.length+' strateg'+(D.playbook.length===1?'y':'ies')+'</span></h2>'+D.playbook.map(function(p){
   var st=(p.status||'').toLowerCase(),cls=st==='active'?'ok':st==='retired'?'':'wait';
   var er=typeof p.expectancyR==='number'?(p.expectancyR>0?'+':'')+p.expectancyR.toFixed(3)+'R':'-';
   return '<div class="strat"><div class="sh"><b>'+esc(p.name)+'</b><span class="pill '+cls+'">'+esc(st||'-')+'</span></div>'+
    '<div class="stats"><div><span class="k">Sample</span><b>'+(p.trades!=null?esc(p.trades)+' trades':'-')+'</b></div><div><span class="k">Win rate</span><b>'+(typeof p.winRate==='number'?p.winRate.toFixed(1)+'%':'-')+'</b></div><div><span class="k">Expectancy</span><b class="'+(p.expectancyR<0?'neg':p.expectancyR>0?'pos':'')+'">'+er+'</b></div></div>'+
    (p.note?'<div class="note" style="margin-top:6px">'+esc(p.note)+'</div>':'')+'</div>';
  }).join('')+'</section>';
 }
 if(D.rules&&D.rules.length){h+='<section class="card"><h2>Desk rules</h2><ul class="rules">'+D.rules.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></section>';}
 if(D.deskLog&&D.deskLog.length){h+='<section class="card"><h2>Desk log <span class="k" style="letter-spacing:0;text-transform:none">newest first</span></h2><ul class="log">'+D.deskLog.map(function(l){return '<li><span class="d">'+esc(l.date||'')+'</span><span>'+esc(l.text||l)+'</span></li>';}).join('')+'</ul></section>';}
 document.getElementById('cards').innerHTML=h;
}
function clock(){
 var e=etNow(),hh=e.h%12||12,am=e.h<12?'AM':'PM';document.getElementById('clk').textContent=hh+':'+(e.m<10?'0':'')+e.m+' '+am;
 var mins=e.h*60+e.m,open=!/Sat|Sun/.test(e.wd)&&mins>=570&&mins<960,el=document.getElementById('mkt');
 el.textContent=open?'MARKET OPEN':(mins<570&&!/Sat|Sun/.test(e.wd)?'PRE-MARKET':'CLOSED');el.className='mkt'+(open?' open':'');
}
function load(){
 fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(j){
   DATA=j;renderTicker();render();setTags();
   document.getElementById('sync').textContent='Synced with desk data at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})+' · refreshes every 60s';
   document.getElementById('syncDot').className='dot';
 }).catch(function(){document.getElementById('sync').textContent='Could not load data.json, retrying in 60s';document.getElementById('syncDot').className='dot err';});
}
resize();var rT;window.addEventListener('resize',function(){clearTimeout(rT);rT=setTimeout(resize,150);});
renderTicker();clock();load();
setInterval(load,60000);setInterval(function(){clock();if(DATA)render();},30000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
