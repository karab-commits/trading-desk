<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K's AI Trading Desk · Neon City</title>
<style>:root{--bg:#070a1f;--cy:#22f3ff;--mg:#ff3df2;--li:#9dff3d;--ye:#ffe14d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dfe8ff;font:13px/1.35 "JetBrains Mono",ui-monospace,Menlo,monospace}
.up{color:#39ff88;text-shadow:0 0 8px #39ff8888}.dn{color:#ff3d6e;text-shadow:0 0 8px #ff3d6e88}.flat{color:#e8f0ff}
.glass{background:rgba(20,24,60,.55);backdrop-filter:blur(10px);border:1px solid rgba(34,243,255,.55);border-radius:10px;box-shadow:0 0 18px rgba(34,243,255,.25),inset 0 0 20px rgba(34,243,255,.06)}
.ph{font-weight:800;letter-spacing:.15em;color:var(--cy);text-shadow:0 0 8px var(--cy);margin-bottom:6px;font-size:11px}
.mut{color:#8b95c9}small{display:block;color:#8b95c9;font-size:10px}
label{display:block;font-size:9px;letter-spacing:.15em;color:#8b95c9;margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#666}.dot.idle{background:var(--ye);box-shadow:0 0 6px var(--ye)}.dot.done{background:#39ff88;box-shadow:0 0 6px #39ff88}.dot.working,.dot.active{background:var(--mg);box-shadow:0 0 8px var(--mg);animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}
.desk{border-left:3px solid var(--c);padding-left:10px}.dh{font-size:16px}.dh b{color:var(--c);text-shadow:0 0 10px var(--c)}.tag{font-size:9px;border:1px solid var(--c);color:var(--c);padding:1px 5px;border-radius:3px;margin-left:6px}.st{float:right;font-size:10px;color:#8b95c9}
.role{color:#8b95c9;font-size:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}.grid2 b{font-size:14px}.now{color:#fff}
.bar{height:8px;background:#ffffff14;border-radius:4px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--cy)),#fff);box-shadow:0 0 10px var(--c)}
.log,.runs{margin:2px 0;padding-left:16px;font-size:11px;max-height:150px;overflow:auto}.detail{font-size:11px;margin-top:8px;color:#b9c3ee}
.empty{padding:14px;border:1px dashed #ffffff33;border-radius:8px;color:#b9c3ee;font-size:12px}
.appr .ap{display:flex;gap:8px;align-items:center;border:1px solid #ffffff22;border-left:3px solid var(--c);border-radius:6px;padding:6px;margin-bottom:5px;font-size:12px}.ap .n{color:var(--ye);font-weight:800}.ap>div{flex:1}.pend{font-size:9px;color:var(--ye);border:1px solid var(--ye);padding:1px 5px;border-radius:3px;box-shadow:0 0 8px #ffe14d55}.cnt{background:var(--mg);color:#000;border-radius:8px;padding:0 6px;margin-left:4px}
.org{text-align:center}.ohead{display:flex;justify-content:center}.oline{height:12px;border-left:1px solid var(--cy);width:0;margin:0 auto;box-shadow:0 0 6px var(--cy)}
.oteam{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;border-top:1px solid var(--cy);padding-top:8px}
.oc{border:1px solid var(--c);border-radius:6px;padding:5px;text-align:left;font-size:10px;cursor:pointer;background:#0008;box-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}.oc b{color:var(--c)}.oc .t{color:#fff;margin-top:2px}.oc .nx{color:#8b95c9}
.ticker{display:flex;gap:28px;white-space:nowrap;animation:tk 30s linear infinite}@keyframes tk{to{transform:translateX(-50%)}}
table{border-collapse:collapse;width:100%;font-size:11px}th{font-size:9px;letter-spacing:.1em;color:#8b95c9;text-align:left;font-weight:400}td,th{padding:4px 6px;border-bottom:1px solid #ffffff12}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid currentColor}

#scene{position:fixed;inset:0}#c{position:absolute;inset:0;width:100%;height:100%}#lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#title{position:absolute;top:10px;left:14px;font-weight:900;font-size:18px;color:var(--mg);text-shadow:0 0 12px var(--mg);z-index:3}#title small a{color:#8b95c9}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;padding:8px 22px;min-width:380px;border-color:var(--ye);box-shadow:0 0 24px #ffe14d55;z-index:3}
#top .v{font-size:11px;letter-spacing:.3em;color:var(--ye);text-shadow:0 0 8px var(--ye)}#total{font-size:38px;font-weight:800}
.col{position:absolute;top:64px;bottom:54px;overflow:auto;display:flex;flex-direction:column;gap:8px;z-index:2}.col>div{padding:9px}
#left{left:10px;width:300px}#right{right:10px;width:340px}#left .oteam{grid-template-columns:1fr 1fr}
#tape{position:fixed;left:0;right:0;bottom:0;height:44px;overflow:hidden;border-radius:0;display:flex;align-items:center;border-width:1px 0 0;z-index:3}
.lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:auto;cursor:pointer;animation:bob 3s ease-in-out infinite}
.lbl .ban{font-size:9px;font-weight:900;letter-spacing:.2em;color:var(--c);text-shadow:0 0 8px var(--c)}
.lbl .card{background:rgba(10,12,40,.78);border:1px solid var(--c);border-radius:6px;padding:4px 8px;font-size:10px;box-shadow:0 0 12px var(--c);min-width:110px}
@keyframes bob{50%{margin-top:-6px}}
button{background:#0008;color:var(--cy);border:1px solid var(--cy);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;box-shadow:0 0 8px #22f3ff55}
#ctl{position:absolute;left:50%;transform:translateX(-50%);top:118px;display:flex;gap:8px;z-index:3}#back{display:none}
.tabs{display:flex;gap:4px;margin-bottom:6px}.tabs button{padding:3px 8px;font-size:10px}.tabs button.on{background:var(--cy);color:#000}
.mb b.big{font-size:22px;display:block}
.wl-it{border:1px solid #ffffff22;border-radius:6px;padding:6px;margin-bottom:6px}.wl-it .h{display:flex;justify-content:space-between}
tv-single-ticker{display:block;min-height:60px;margin-top:4px}
#flat{display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:8px}
#flat .fb{padding:8px;cursor:pointer;border-color:var(--c);box-shadow:0 0 10px var(--c)}
#drawer{display:none}#drawer.open{display:block}
body.nogl #scene{position:relative;height:auto;inset:auto;min-height:150px}body.nogl #c,body.nogl #lbls{display:none}body.nogl #flat{display:grid}body.nogl #title,body.nogl #top,body.nogl #ctl{position:static;transform:none;margin:8px auto;width:max-content;max-width:94%}body.nogl .col{width:auto!important}
body.nogl .col,body.narrow .col{position:static;width:auto;overflow:visible;padding:0 8px;margin-bottom:8px}
body.nogl #cols{display:grid;grid-template-columns:1fr 1fr;padding-bottom:50px}
@media(max-width:800px){#scene{position:relative;height:62vh}#top{min-width:0;width:94%;top:40px;padding:6px}#total{font-size:26px}#title{font-size:13px;top:6px}
 #ctl{top:auto;bottom:8px}.lbl .card{min-width:0;padding:2px 5px;font-size:9px}.lbl .card .x{display:none}
 .col{position:static;width:auto!important;overflow:visible;padding:0 8px;margin-top:8px}#cols{padding-bottom:50px}body.nogl #cols{display:block}}
</style></head><body>
<div id="scene"><canvas id="c"></canvas><div id="lbls"></div>
<div id="title">K'S AI TRADING DESK <small class="mut" id="upd"></small> <small><a href="bullpen.html">Classic bullpen view →</a></small></div>
<div id="top" class="glass"><div class="v">THE VAULT · <span id="days"></span> TRADING DAY(S) · REAL P&L</div><div id="total" class="flat">—</div>
<div class="bar" style="--c:var(--ye)"><i id="prog"></i></div><small id="vsub"></small></div>
<div id="ctl"><button id="back">← Back to city</button><button id="replay">▶ Replay today's events</button></div>
<div id="flat"></div></div>
<div id="cols"><div id="left" class="col"><div class="glass mb" id="money"></div><div class="glass" id="appr"></div><div class="glass" id="org"></div><div class="glass"><div class="ph">DAILY REAL P&L</div><div id="chart"></div></div></div>
<div id="right" class="col"><div class="glass" id="drawer"></div><div class="glass"><div class="ph">TODAY'S WATCHLIST</div><small id="wu"></small><div id="wl"></div></div>
<div class="glass"><div class="ph">REAL EVENTS (journal)</div><div id="evl"></div></div></div></div>
<div id="tape" class="glass"><div class="ticker" id="tk"></div></div>
<script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-single-ticker.js"></script>
<script>// ---- shared core: reads ONLY data.json + journal.json; no invented numbers ----
const BOTCOL={kiwi:'#ffe14d',scanner:'#22f3ff',news:'#ff3df2',whale:'#4d8bff',risk:'#ff4d6d',quant:'#9dff3d',journal:'#ffa53d',options:'#b14dff'};
const BOTCAT={kiwi:'HEAD OF DESK',scanner:'SCANNER',news:'NEWS',whale:'FLOW',risk:'RISK',quant:'QUANT',journal:'JOURNAL',options:'OPTIONS'};
const ORDER=['kiwi','scanner','news','whale','risk','quant','journal','options'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=(v,cur='CAD')=>v==null||isNaN(v)?'—':(v<0?'-':(v>0?'+':''))+'$'+Math.abs(v).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+(cur?' '+cur:'');
const plain=(v)=>v==null?'—':'$'+Number(v).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const tcls=v=>v>0?'up':v<0?'dn':'flat';
const hhmm=iso=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Toronto'})+' ET'};
async function loadDesk(){
  const bust='?t='+Date.now();
  const [d,j]=await Promise.all([fetch('data.json'+bust).then(r=>r.json()),fetch('journal.json'+bust).then(r=>r.json()).catch(()=>({ideas:[]}))]);
  const ideas=j.ideas||[];
  const bots=ORDER.map(id=>d.bots.find(b=>b.id===id)).filter(Boolean).concat(d.bots.filter(b=>!ORDER.includes(b.id)));
  bots.forEach(b=>{
    const mine=ideas.filter(i=>i.bot===b.id);
    b._ideas=mine;
    b._paper=mine.reduce((s,i)=>s+(i.result&&typeof i.result.netCAD==='number'?i.result.netCAD:0),0);
    b._real=b.pnlAllTime??0;
    b._position=(d.account.openPositions>0&&d.watchlist.some(w=>w.bot===b.id&&/open|filled|taken/i.test(w.status)))?'IN TRADE':'FLAT';
  });
  // daily history: real P&L per day from paper.byDate[].real (only days the desk has run)
  const days=Object.entries((d.paper&&d.paper.byDate)||{}).sort().map(([date,v])=>({date,real:v.real??0,paper:v.net??0,ideas:v.ideas??0,taken:v.taken??0}));
  // real events for pulses: idea logged, idea resolved
  const events=[];
  ideas.forEach(i=>{events.push({t:i.loggedAt,bot:i.bot,kind:'logged',text:`${i.ticker} ${i.side} idea logged`});
    if(i.result&&i.result.resolvedAt)events.push({t:i.result.resolvedAt,bot:i.bot,kind:'resolved',text:`${i.ticker} scored: ${i.result.outcome} (paper ${money(i.result.netCAD)})`});});
  events.sort((a,b)=>new Date(a.t)-new Date(b.t));
  // paper P&L by ticker (resolved journal ideas)
  const byTicker={};ideas.forEach(i=>{if(i.result&&typeof i.result.netCAD==='number')byTicker[i.ticker]=(byTicker[i.ticker]||0)+i.result.netCAD;});
  return {d,ideas,bots,days,events,byTicker};
}
function vaultStats(S){const d=S.d;const real=S.days.map(x=>x.real);
  return {total:d.pnlAllTime.total,today:d.pnlToday.total,tradesToday:d.pnlToday.trades,tradesAll:d.pnlAllTime.trades,days:d.desk.daysRunning,
    green:real.filter(v=>v>0).length,red:real.filter(v=>v<0).length,flat:real.filter(v=>v===0).length,
    best:real.length?Math.max(...real):null,equity:d.account.equity,bp:d.account.buyingPower,cur:d.account.currency,maxRisk:d.account.maxRiskPerTrade,
    paperNet:(d.scorecard&&d.scorecard.week&&d.scorecard.week.paper)?d.scorecard.week.paper.netPnl:null};}
function odometer(el,target,cur){ // ticks from 0 to the real value once; ends exactly on data value
  const t0=performance.now(),dur=1400;const step=n=>{const k=Math.min(1,(n-t0)/dur);el.textContent=money(target*(1-Math.pow(1-k,3)),cur);if(k<1)requestAnimationFrame(step);else el.textContent=money(target,cur)};requestAnimationFrame(step);}
function wlRows(S){return S.d.watchlist.map(w=>{const cad=w.currency==='CAD';
  const pnl=w.openPnlCAD;return {...w,pnlTxt:pnl==null?(/skip/i.test(w.status)?'not taken':'—'):money(pnl),pnlCls:tcls(pnl||0)}});}
function dailyChartSVG(S,w=520,h=170){
  const days=S.days;if(days.length<5){
    return `<div class="empty">Only <b>${days.length}</b> trading day${days.length===1?'':'s'} logged. Real P&L: ${days.map(x=>`${x.date.slice(5)} <b class="${tcls(x.real)}">${money(x.real)}</b>`).join(', ')||'none yet'}.<br><small>Bar chart fills in as real trading days are logged. Paper results are not counted as P&L.</small></div>`;}
  const m=Math.max(1,...days.map(x=>Math.abs(x.real)));const bw=w/days.length;
  return `<svg viewBox="0 0 ${w} ${h}" class="bars"><line x1="0" x2="${w}" y1="${h/2}" y2="${h/2}" stroke="#ffffff33"/>${days.map((x,i)=>{const bh=Math.abs(x.real)/m*(h/2-10);return `<rect x="${i*bw+2}" width="${bw-4}" y="${x.real>=0?h/2-bh:h/2}" height="${Math.max(1,bh)}" fill="${x.real>=0?'#39ff88':'#ff3d6e'}"><title>${x.date} ${money(x.real)}</title></rect>`}).join('')}</svg>`;}
function botDeskHTML(S,b){const a=b.activity||{};const col=BOTCOL[b.id]||'#22f3ff';
  const ideas=b._ideas;const scored=ideas.filter(i=>i.result).length;
  return `<div class="desk" style="--c:${col}">
  <div class="dh"><span class="dot ${a.state}"></span><b>${esc(b.name)}</b> <span class="tag">${esc(BOTCAT[b.id]||'')}</span><span class="st">${esc((a.state||'').toUpperCase())}</span></div>
  <div class="role">${esc(b.role)}</div>
  <div class="grid2"><div><label>POSITION</label><b>${b._position}</b></div><div><label>REAL P&L TODAY</label><b class="${tcls(b.pnlToday)}">${money(b.pnlToday)}</b></div>
  <div><label>REAL P&L ALL-TIME</label><b class="${tcls(b._real)}">${money(b._real)}</b></div><div><label>TRADES (today/all)</label><b>${b.tradesToday}/${b.tradesAllTime}</b></div></div>
  <label>NOW</label><div class="now">${esc(a.now)}</div>
  <label>NEXT</label><div class="now">${esc(a.next||'—')}</div>
  <label>IDEAS SCORED</label><div class="bar"><i style="width:${ideas.length?scored/ideas.length*100:0}%"></i></div><small>${scored}/${ideas.length} journal ideas resolved${ideas.length?` · paper net ${money(b._paper)} (not real P&L)`:''}</small>
  <label>THOUGHTS</label><ul class="log">${(a.log||[]).map(l=>`<li>${esc(l)}</li>`).join('')||'<li class="mut">No log entries</li>'}${ideas.map(i=>`<li><span class="mut">${hhmm(i.loggedAt)}</span> ${esc(i.ticker)} ${esc(i.side)} @ ${i.entry} → ${i.result?esc(i.result.outcome)+' '+money(i.result.netCAD)+' paper':'open'}</li>`).join('')}</ul>
  <div class="detail">${esc(a.detail)}</div><small class="mut">since ${hhmm(a.since)}</small></div>`;}
// ---- Paperclip-style panels ----
// data.json has no approvals/proposals field yet (only lastApprovedIdea=null), so this is a clearly named STATIC list
// copied from Kiwi's Nov 2 daily review. Proposed schema for later: data.json "approvals":[{id,title,from,date,status}]
const STATIC_PENDING_APPROVALS=[
 {from:'kiwi',date:'2026-11-02',title:'Untested midday ideas become paper-only (no live orders)'},
 {from:'kiwi',date:'2026-11-02',title:"Update the rules card to 'Kiwi leads'"},
 {from:'quant',date:'2026-11-02',title:'Move SOFI and HXT to testing'}];
function approvalsList(S){return (S.d.approvals&&S.d.approvals.filter(a=>!a.status||a.status==='pending'))||STATIC_PENDING_APPROVALS;}
function approvalsHTML(S){const L=approvalsList(S);const src=S.d.approvals?'data.json approvals':'static list (Nov 2 daily review) — no data.json field yet';
 return `<div class="appr"><div class="ph">APPROVALS WAITING ON K <span class="cnt">${L.length}</span></div>${L.map((a,i)=>`<div class="ap" style="--c:${BOTCOL[a.from]||'#fff'}"><span class="n">${i+1}</span><div>${esc(a.title)}<small>from ${esc((S.bots.find(b=>b.id===a.from)||{}).name||a.from)} · ${esc(a.date)}</small></div><span class="pend">PENDING</span></div>`).join('')}<small class="mut">Source: ${src}</small></div>`;}
function orgChartHTML(S){const head=S.bots.find(b=>b.id==='kiwi');const team=S.bots.filter(b=>b.id!=='kiwi');
 const card=b=>{const a=b.activity||{};return `<div class="oc" data-bot="${b.id}" style="--c:${BOTCOL[b.id]}"><div><span class="dot ${a.state}"></span><b>${esc(b.name)}</b></div><div class="t">${esc(a.now||'—')}</div><div class="nx">Next: ${esc(a.next||'—')}</div></div>`};
 return `<div class="org"><div class="ph">ORG CHART</div><div class="ohead">${head?card(head):''}</div><div class="oline"></div><div class="oteam">${team.map(card).join('')}</div></div>`;}
function runHistoryHTML(S,b){const a=b.activity||{};const rows=(a.log||[]).map(l=>({t:'',x:l})).concat(b._ideas.flatMap(i=>[{t:i.loggedAt,x:`Logged ${i.ticker} ${i.side} idea`},...(i.result?[{t:i.result.resolvedAt,x:`Scored ${i.ticker}: ${i.result.outcome}`}]:[])]));
 rows.push({t:a.since,x:`Current: ${a.now}`});
 return `<label>RUN HISTORY</label><ol class="runs">${rows.map(r=>`<li>${r.t?`<span class="mut">${hhmm(r.t)}</span> `:''}${esc(r.x)}</li>`).join('')}</ol>`;}
</script>
<script>
// ===== 2D layer: works with or without WebGL; everything comes from data.json / journal.json =====
const TV_US={RIVN:'NASDAQ:RIVN',SOFI:'NASDAQ:SOFI',NVDA:'NASDAQ:NVDA',AAPL:'NASDAQ:AAPL',PLTR:'NASDAQ:PLTR',QQQ:'NASDAQ:QQQ',TSLA:'NASDAQ:TSLA',AMD:'NASDAQ:AMD',MSFT:'NASDAQ:MSFT',AMZN:'NASDAQ:AMZN',META:'NASDAQ:META',GOOGL:'NASDAQ:GOOGL',SPY:'AMEX:SPY',IWM:'AMEX:IWM',EL:'NYSE:EL',PGEN:'NASDAQ:PGEN',CNQ:'NYSE:CNQ'};
function tvSym(w){if(w.tvSymbol)return w.tvSymbol;const t=String(w.ticker||'').toUpperCase();const m=t.match(/^(.+)\.(TO|V|NE|CN)$/);if(m)return {TO:'TSX',V:'TSXV',NE:'NEO',CN:'CSE'}[m[2]]+':'+m[1];return TV_US[t]||t}
const todayET=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Toronto'});
const PER=[['TODAY','pnlToday','tradesToday'],['WEEK','pnlWeek','tradesWeek'],['ALL TIME','pnlAllTime','tradesAllTime']];let per=0,S=null,openId=null;
window.DESK={onEvent:null,onData:null};
function renderMoney(){const p=PER[per];const t=S.d[p[1]]||{};
 $('#money').innerHTML=`<div class="ph">MONEY BOARD · REAL</div><div class="tabs">${PER.map((x,i)=>`<button class="${i===per?'on':''}" data-p="${i}">${x[0]}</button>`).join('')}</div>
 <b class="big ${tcls(t.total)}">${money(t.total)}</b><small>realized ${money(t.realized)} · unrealized ${money(t.unrealized)} · ${t.trades??0} trade(s)</small>
 <table style="margin-top:6px"><tr><th>BOT</th><th>P&L</th><th>TRADES</th></tr>${S.bots.map(b=>`<tr><td style="color:${BOTCOL[b.id]}">${esc(b.name)}</td><td class="${tcls(b[p[1]])}">${money(b[p[1]],'')}</td><td>${b[p[2]]??0}</td></tr>`).join('')}</table>`;
 $('#money').querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{per=+e.dataset.p;renderMoney()});}
function renderWatch(){const items=S.d.watchlist.filter(w=>w.date===todayET());const sec=$('#wl');const key=items.map(w=>w.ticker+'|'+tvSym(w)).join(',');
 const latest=items.map(w=>w.priceTime).filter(Boolean).sort().pop();$('#wu').textContent=(latest?'desk prices (Questrade) '+hhmm(latest):'no prices yet')+' · page re-reads data.json every 60s';
 if(sec.dataset.key!==key){sec.dataset.key=key;sec.innerHTML=items.length?items.map((w,i)=>`<div class="wl-it"><div class="h" data-i="${i}"></div><tv-single-ticker symbol="${esc(tvSym(w))}" theme="dark" transparent></tv-single-ticker><div class="b" data-i="${i}"></div></div>`).join('')+'<small>Widget: TradingView, delayed (TSX ~15 min; US Cboe One). Desk price drives status/P&L.</small>':'<div class="empty">No stocks on the watchlist yet today</div>';}
 items.forEach((w,i)=>{const r=wlRows({d:{watchlist:[w]}})[0];const h=sec.querySelector(`.h[data-i="${i}"]`),b=sec.querySelector(`.b[data-i="${i}"]`);if(!h)return;
  h.innerHTML=`<b style="color:var(--cy)">${esc(w.ticker)}</b> <span>${esc(w.side||'no trade')}</span> <span class="badge" style="color:var(--ye)" title="${esc(w.reason||'')}">${esc(String(w.status).toUpperCase())}</span>`;
